# ==============================================================================
# Industrial Edge Gateway Configuration
# ==============================================================================

# Device Identification
device_id=device01

# Network Interfaces & Ports
# mcu_host / mcu_port: Localhost TCP link simulating physical UART/RS-485 link
mcu_host=127.0.0.1
mcu_port=9000

# CLI TCP Monitoring server port (interactive text interface: nc localhost 9100)
monitor_host=127.0.0.1
monitor_port=9100

# MCU simulation fault injection / remote management port
fault_port=9001

# Real-Time & Safety Parameters
# Watchdog timeout in milliseconds: if no valid MCU frame is received within
# this window, watchdog trips and forces SAFE_STOP / EMERGENCY_STOP.
watchdog_timeout_ms=2000

# Sensor staleness timeout in milliseconds: if an individual sensor reading is
# not updated within this timeframe, it is marked STALE and triggers safe stop.
stale_timeout_ms=1500

# Control loop evaluation interval in milliseconds (50 Hz control cycle)
control_cycle_ms=20

# Actuator recovery hysteresis time in milliseconds: sensor must remain in
# nominal range continuously for this long before clearing WARNING state.
recovery_hysteresis_ms=2000

# Logging Configuration
# Levels: DEBUG, INFO, WARN, ERROR, CRITICAL
log_level=INFO
log_file=logs/gateway.log
console_logging=true
