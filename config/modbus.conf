# ==============================================================================
# Modbus TCP Industrial SCADA Server Configuration
# ==============================================================================

# Enable or disable Modbus TCP service
modbus_enabled=true

# Bind interface and port (Port 1502 is standard unprivileged port; 502 requires root)
modbus_bind_address=0.0.0.0
modbus_port=1502

# Modbus Unit ID (Slave ID)
unit_id=1

# Maximum simultaneous SCADA client connections
max_clients=10

# Register Map Documentation:
# 40001 (0x0000): Temperature (°C x 10, signed int16)
# 40002 (0x0001): Motor Current (A x 10, signed int16)
# 40003 (0x0002): Vibration (mm/s x 10, signed int16)
# 40004 (0x0003): Motor Speed (RPM, uint16)
# 40005 (0x0004): Actuator State (0=OFF, 1=STARTING, 2=RUNNING, 3=WARNING, 4=EMERGENCY_STOP, 5=SAFE_STOP)
# 40006 (0x0005): Fault Code (0=NONE, 1=HIGH_TEMP, 2=HIGH_CURRENT, 3=HIGH_VIBE, 4=STALE_SENSOR, 5=WATCHDOG_TIMEOUT, 6=CRC_ERROR)
# 40007 (0x0006): Watchdog Status (1=OK, 0=EXPIRED/FAULT)
# 40008 (0x0007): MCU Connection Status (1=CONNECTED, 0=DISCONNECTED)
