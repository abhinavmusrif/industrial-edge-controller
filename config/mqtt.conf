# ==============================================================================
# MQTT Telemetry Pipeline Configuration
# ==============================================================================

# Enable or disable MQTT reporting (allows gateway to run offline without broker)
mqtt_enabled=true

# Mosquitto / MQTT Broker endpoint
broker_host=127.0.0.1
broker_port=1883

# Client identification
client_id=industrial-edge-gateway-01
clean_session=true

# Keep-alive timeout in seconds
keepalive_sec=60

# Topic namespace
topic_prefix=industrial/device01

# Sub-topics:
#   ${topic_prefix}/temperature
#   ${topic_prefix}/current
#   ${topic_prefix}/vibration
#   ${topic_prefix}/rpm
#   ${topic_prefix}/status
#   ${topic_prefix}/fault
#   ${topic_prefix}/telemetry

# Aggregated telemetry publish interval in milliseconds
telemetry_interval_ms=500

# Broker reconnection retry interval in milliseconds
reconnect_interval_ms=5000
